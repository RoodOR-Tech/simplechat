<!doctype html>
<html lang="en" data-bs-theme="auto">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Minimal Chat</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='chat.css') }}">
</head>
<body class="d-flex flex-column vh-100">
    <header class="border-bottom px-3 py-2 d-flex align-items-center gap-2 flex-wrap">
        <strong class="me-auto">Minimal Chat</strong>
        <label for="model-select" class="form-label mb-0 small text-body-secondary">Model</label>
        <select id="model-select" class="form-select form-select-sm w-auto" aria-label="Model"></select>
        <button id="new-chat" type="button" class="btn btn-sm btn-outline-secondary">New chat</button>
        <span class="small text-body-secondary">{{ user }}</span>
    </header>

    <main id="messages" class="flex-grow-1 overflow-auto px-3 py-3" aria-live="polite">
        <div id="empty-state" class="text-center text-body-secondary mt-5">
            {% if has_models %}
            Pick a model and start typing.
            {% else %}
            No models are configured. Set <code>AZURE_OPENAI_DEPLOYMENTS</code>.
            {% endif %}
        </div>
    </main>

    <div id="error-banner" class="alert alert-danger mx-3 mb-2 d-none" role="alert"></div>

    <form id="chat-form" class="border-top p-3 d-flex gap-2">
        <textarea id="prompt" class="form-control" rows="2" placeholder="Message (Enter to send, Shift+Enter for a new line)"
                  required></textarea>
        <button id="send" type="submit" class="btn btn-primary">Send</button>
    </form>

    <script src="{{ url_for('static', filename='chat.js') }}"></script>
</body>
</html>
